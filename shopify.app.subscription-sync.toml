client_id = "188ccf1d41284c331ee1b521244b165b"
name = "subscription-sync"
handle = "subscription-sync-2"
application_url = "https://subscription-sync-lyart.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "read_products,read_inventory,read_locations,read_customers,read_orders,write_orders"

[auth]
redirect_urls = [
  "https://subscription-sync-lyart.vercel.app/auth/callback"
]

[pos]
embedded = false